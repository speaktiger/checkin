<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe6f6">
<title>SpeakTiger check-in</title>
<style>
  :root {
    --bg:      #dbe6f6;
    --card:    #ffffff;
    --fg:      #14161c;
    --dim:     #38445c;
    --muted:   #78849a;
    --line:    #b9c9e2;
    --accent:  #3d81e8;
    --move:    #b84ae0;   /* purple, exactly the guest app's */
    --stay:    #f0cf3a;   /* yellow */
    --onmove:  #ffffff;
    --onstay:  #14161c;
    --good:    #2f7a4a;
    --warn:    #c2410c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; border: 0; cursor: pointer; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .count { font-size: 22px; font-weight: 850; letter-spacing: -.02em; }
  .count small { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .parity { font-size: 13px; font-weight: 850; text-transform: uppercase; letter-spacing: .1em; }
  .parity.odd  { color: var(--warn); }
  .parity.even { color: var(--good); }

  .last { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 34px; }
  .last-txt { flex: 1; font-size: 13px; color: var(--dim); font-weight: 600; }
  .last-txt b { color: var(--fg); display: block; }
  .last-txt i { font-style: normal; display: block; }
  #undo {
    background: var(--bg); color: var(--dim); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; font-weight: 800;
  }
  #undo:disabled { opacity: .35; }
  #save, #push { background: var(--bg); color: var(--dim); border-radius: 10px;
                 padding: 8px 12px; font-size: 13px; font-weight: 800; }
  #push { background: var(--accent); color: #fff; }
  #over { background: var(--warn); color: #fff; border-radius: 10px;
          padding: 8px 12px; font-size: 13px; font-weight: 800; }
  #over[hidden] { display: none; }

  /* diagnostics only, and only with &debug=1 */
  #trace { margin: 0 12px 12px; padding: 10px 12px; background: var(--card);
           border-radius: 12px; font-size: 11px; line-height: 1.55;
           font-family: ui-monospace, Menlo, monospace; color: var(--muted);
           max-height: 34vh; overflow-y: auto; }
  #trace[hidden] { display: none; }
  #trace .tr { white-space: nowrap; }
  #trace b { color: var(--fg); font-weight: 700; }
  .trok  { color: var(--good); font-weight: 700; }
  .trbad { color: var(--warn); font-weight: 700; }

  #chooser { position: fixed; inset: 0; z-index: 35; display: flex;
             align-items: flex-end; justify-content: center;
             background: rgba(20, 22, 28, .45); padding: 12px; }
  #chooser[hidden] { display: none; }
  #chooser .sheet { width: 100%; max-width: 460px; background: var(--card);
                    border-radius: 18px; padding: 14px; }
  .pickhead { font-size: 13px; font-weight: 800; color: var(--muted);
              text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .pick { display: block; width: 100%; text-align: left; background: var(--bg);
          border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; color: var(--fg); }
  .pick b { display: block; font-size: 16px; font-weight: 800; }
  .pick span { display: block; margin-top: 2px; font-size: 12.5px;
               color: var(--muted); font-weight: 600; }
  #pickclose { display: block; width: 100%; background: transparent; color: var(--dim);
               padding: 12px; font-size: 15px; font-weight: 800; }
  #push:disabled { background: var(--bg); color: var(--dim); opacity: .45; }
  #banner.info { animation: pulse 1.4s ease-in-out infinite; }
  #banner.warn, #banner.ok { animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .74; } }
  @media (prefers-reduced-motion: reduce) { #banner.info { animation: none; } }

  #sync { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  #sync.pending { color: var(--warn); }
  #sync.saved   { color: var(--good); }
  #build { margin-top: 2px; font-size: 11px; font-weight: 700; color: var(--line); }

  #q {
    width: 100%; margin-top: 10px; padding: 13px 14px; font-size: 17px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--fg);
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* ---------- list ---------- */
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 24px; }
  .row {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  }
  .row.done { background: #eaf4ec; }
  .who { flex: 1; min-width: 0; }
  .nm { font-size: 19px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .row.done .nm { color: var(--good); }
  /* Secondary by design — it exists to tell two people of the same name apart,
     which is exactly when truncating it is worst. Side by side when they fit,
     stacked when they don't, never cut. */
  /* One per line, always. Wrapping only when they did not fit made the list
     ragged — some rows two lines, some three, depending on the address. */
  .meta { margin-top: 2px; font-size: 12.5px; color: var(--muted); font-weight: 600;
          display: flex; flex-direction: column; gap: 1px; overflow-wrap: anywhere; }
  .go {
    flex: 0 0 auto; background: var(--accent); color: #fff; border-radius: 11px;
    padding: 12px 16px; font-size: 15px; font-weight: 800;
    transition: transform .12s ease, filter .12s ease;
  }
  .go.pressed { transform: scale(.95); filter: brightness(.9); transition-duration: 0s; }
  .row.done .go { background: #d8e6dc; color: var(--good); }
  .seatn { font-size: 12px; font-weight: 800; color: var(--good); white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-weight: 700; padding: 40px 20px; }

  /* ---------- the sticky card ---------- */
  #card {
    position: fixed; inset: 0; z-index: 30; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    padding: 24px;
  }
  #card[hidden] { display: none; }
  #card.purple { background: var(--move); color: var(--onmove); }
  #card.yellow { background: var(--stay); color: var(--onstay); }
  #card .lbl { font-size: clamp(18px, 5vw, 30px); font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
  #card .tbl { font-size: clamp(90px, 42vw, 300px); font-weight: 900; line-height: .9; letter-spacing: -.04em; }
  #card .nm2 { font-size: clamp(16px, 4.4vw, 26px); font-weight: 750; opacity: .85; text-align: center; }
  #cardclose {
    background: rgba(255,255,255,.92); color: var(--fg); border-radius: 14px;
    padding: 16px 44px; font-size: 18px; font-weight: 850;
  }
  #card.yellow #cardclose { background: rgba(20,22,28,.9); color: #fff; }

  #banner {
    flex: 0 0 auto; background: var(--warn); color: #fff; text-align: center;
    padding: 8px 12px; font-size: 13px; font-weight: 800;
  }
  #banner[hidden] { display: none; }
  #banner.info { background: var(--accent); }
  #banner.warn { background: #7c6f5a; }
  #banner.ok   { background: var(--good); }
</style>
</head>
<body>

<div id="banner" hidden></div>

<header>
  <div class="top">
    <div class="count"><span id="n">0</span> <small>of <span id="total">0</span> checked in</small></div>
    <div class="parity" id="parity"></div>
  </div>
  <div class="last">
    <div class="last-txt" id="last">No check-ins yet.</div>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="over" type="button" hidden>Take over</button>
    <button id="push" type="button" title="Save the current state to the sheet now">Save</button>
    <button id="save" type="button" title="Export a CSV of everything this phone knows">Export</button>
  </div>
  <div id="sync">Loading…</div>
  <div id="build"></div>
  <input id="q" type="search" placeholder="Search name, email or phone"
         autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
</header>

<main id="list"></main>

<div id="trace" hidden></div>

<div id="chooser" hidden>
  <div class="sheet">
    <div class="pickhead">Choose what to export</div>
    <div id="pickrows"></div>
    <button id="pickclose" type="button">Cancel</button>
  </div>
</div>

<div id="card" hidden>
  <div class="lbl" id="cardcolour"></div>
  <div class="tbl" id="cardtable"></div>
  <div class="nm2" id="cardname"></div>
  <button id="cardclose" type="button">Done</button>
</div>

<script>
/* ===========================================================================
   SpeakTiger check-in
   ---------------------------------------------------------------------------
   ONE WRITER. The phone owns who sits where; the sheet records it.

   What goes to the sheet is the whole assignment map, not a list of actions.
   A snapshot is idempotent, so sending the SAME one twice costs nothing — no
   queue, nothing to order, nothing that can block behind a rejection. Ten
   offline changes are still one write, because what is written is the state.

   Idempotence does not make two DIFFERENT snapshots safe to reorder, which an
   earlier comment here claimed. Each carries a counter and the sheet ignores
   anything older than it has already accepted.

   Structure comes from the sheet every load: the guest list and the seating
   plan. Assignments come from the cache when it holds unsaved work, and from
   the sheet otherwise. Columns E and I are written, never read back.
   =========================================================================== */

const BUILD = "1.0";

/* The shape the Speed Friending app already uses, because it works: try, then
   still trying, then a calm steady offline bar — and a green flash on recovery
   that gets out of the way. What it must never do is flip red for a second
   between attempts; that reads as a fault when the app is simply retrying. */
const RETRY_AT   = 15000;
const OFFLINE_AT = 30000;
const FLASH_MS   = 3000;
/* Long enough to keep the container alive, short enough that it never lapses.
   A four-hour event is about 240 pings, none of which open the spreadsheet. */
const WARM_MS    = 60000;
/* Right after the phone wakes, a hang is almost always a dead socket iOS is
   still holding from before it slept — waiting 30s for that is 30s wasted, and
   a few rounds of it is the two or three minutes before anything saved. Give
   the first attempt after a wake a short leash so it gets a fresh connection;
   once one round trip has completed, go back to being patient with cold
   starts, which do eventually answer. */
const WAKE_MS    = 8000;
const WAKE_FOR   = 20000;

const API = "https://script.google.com/macros/s/AKfycbz1Rv9dOJM3C_REAckYe173wJ3-hmAH23llLRs85EP-HTlYWCVfEAb6l_WWd8a212Qv/exec";

const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") === "1";

/* ------------------------------------------------------------- diagnostics --
   Only visible with &debug=1, and it changes nothing about how the app works.
   Its job is to answer one question: when a save is slow, is the PHONE's
   network slow, or only this one connection to Google?

   nextHopProtocol is the browser's own answer to "h2 or h3", but a browser only
   fills it in for a cross-origin request when the server sends
   Timing-Allow-Origin, and Google's does not — so it will usually read
   "unknown". The timings below do not depend on it.                          */
const trace = [];
const clock = () => (typeof performance !== "undefined" && performance.now
  ? performance.now() : Date.now());

function hop(url) {
  try {
    const all = performance.getEntriesByType("resource");
    for (let i = all.length - 1; i >= 0; i--) {
      if (all[i].name.indexOf(url.split("?")[0]) === 0)
        return all[i].nextHopProtocol || "unknown";
    }
  } catch (e) {}
  return "unknown";
}

function mark(kind, ms, result, note) {
  trace.push({ at: new Date(), kind: kind, ms: Math.round(ms),
               result: result, note: note || "",
               woke: wokeAt ? Math.round(Date.now() - wokeAt) : null });
  if (trace.length > 60) trace.shift();
  if (DEBUG) paintTrace();
}

/* A request to a DIFFERENT host, fired only while a save is struggling and only
   with &debug=1. If this comes back quickly while the save is still hanging,
   the phone's network is fine and the stall belongs to the Google connection
   alone — which is the whole question. no-cors because we want the timing, not
   the body. */
async function probeOther() {
  const t = clock();
  try {
    await fetch("https://sync.speaktiger.app/?probe=1",
                { mode: "no-cors", cache: "no-store" });
    mark("probe other host", clock() - t, "ok");
  } catch (e) {
    mark("probe other host", clock() - t, "failed", String(e.message || e).slice(0, 40));
  }
}

/* The measurement that decides whether anything can be done. HTTP/1.1 keeps
   about six connections per host, so a request sent while another is still
   pending cannot reuse the busy one — the browser has to open a second. If that
   second connection is fast while the first is stuck, the stall is one dead
   socket and can be stepped around. If it is stuck too, the whole host is
   unreachable and no amount of cleverness in this app changes that.

   Fired WITHOUT waiting for the stuck request to be abandoned, which is the
   whole point: aborting first hands the dead socket back to the pool, and the
   next attempt picks the same one up again. */
async function probeSameHost() {
  const t = clock();
  try {
    const ctrl = new AbortController();
    await withDeadline(
      fetch(API + "?ping=1", { cache: "no-store", signal: ctrl.signal }),
      ctrl, 12000);
    mark("probe GOOGLE parallel", clock() - t, "ok");
  } catch (e) {
    mark("probe GOOGLE parallel", clock() - t, "failed", String(e.message || e).slice(0, 40));
  }
}

function paintTrace() {
  const el = $("trace");
  if (!el) return;
  el.hidden = false;
  el.innerHTML = trace.slice().reverse().map((r) => {
    const t = r.at.toTimeString().slice(0, 8);
    return '<div class="tr"><b>' + t + "</b> " + esc(r.kind) +
      ' <span class="' + (r.result === "ok" ? "trok" : "trbad") + '">' +
      esc(r.result) + "</span> " + r.ms + "ms" +
      (r.woke !== null ? " · " + r.woke + "ms after waking" : "") +
      (r.note ? " · " + esc(r.note) : "") + "</div>";
  }).join("");
}
const TAB = params.get("tab") || "";
const KEY = params.get("k")   || "";

const $ = (id) => document.getElementById(id);
/* A missing element threw and took the rest of boot with it — no retry timer,
   no wake listeners, no worker registration. Never worth that. */
const setText = (id, t) => { const el = $(id); if (el) el.textContent = t; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* Folded the same way the sheet's builder sorts, so what the host types matches
   what they see. NFD alone misses these: Ł ø ß have no combining form. */
const fold = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\u0141/g, "L").replace(/\u0142/g, "l")
  .replace(/\u00d8/g, "O").replace(/\u00f8/g, "o")
  .replace(/\u00c6/g, "AE").replace(/\u00e6/g, "ae")
  .replace(/\u00df/g, "ss").toLowerCase();

const CACHE_V = 4;                       /* the shape of the cache, not the data */
const KEEP_MS = 72 * 60 * 60 * 1000;
const READ_MS = 5000;                    /* a read blocks the screen, so give up early */
/* Unless there is nothing to fall back to. The short deadline exists to reach
   the cache quickly; on a first load of this event there is no cache, so haste
   buys nothing and costs the load — and a cold Apps Script over five seconds is
   ordinary, especially before any ping has warmed it. */
const FIRST_READ_MS = 30000;
/* A write does not: check-in is instant and local, and this runs behind it. The
   5s it used to share with reads bought nothing and created the one race worth
   caring about — abandoning a write that was still alive, so it could land
   after a newer one. */
/* Generous on purpose. Apps Script cold starts routinely take 10-30s, and at
   12s every attempt was aborted just as the server woke, then a fresh cold
   request began 8s later — three minutes of that before one got through. The
   stage banner runs on its own clock, so a long deadline no longer means a
   silent app, and the sequence counter makes a late write harmless. */
const WRITE_MS = 30000;
const CACHE   = () => "st_checkin_" + TAB;
/* Deliberately not under st_checkin_: the sweeper clears that prefix by age,
   and this must outlive every event on the phone. */
const DEVICE_KEY = "speaktiger_checkin_device_id";
const RECOVERY  = () => "st_checkin_recovery_" + TAB + "_";

const DEVICE = (function () {
  try {
    let d = localStorage.getItem(DEVICE_KEY);
    if (!d) {
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "d-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(DEVICE_KEY, d);
    }
    return d;
  } catch (e) { return "d-" + Math.random().toString(36).slice(2, 10); }
})();

let guests = [], seats = [];             /* structure — always from the sheet */
let seated = {};                         /* guestId -> seat row. The whole state. */
let rev = "", status = "open", savedAt = "";
let seq = 0;                             /* which snapshot is newest; only ever rises */
let dirty = false;                       /* holds work the sheet has not confirmed */
let loaded = false, busy = false, wanted = false;
let bannerKind = "";
let saving = false;                      /* a write is in flight right now */
let wake = null;                         /* screen wake lock */
/* Whether the last SAVE was refused — not whether a banner happens to look
   serious. The retry loop used to read bannerKind, so a local message like
   "No seats left" silenced retries of a perfectly good pending snapshot. */
let saveRefused = false;
let refetch = false;                /* re-read the sheet once after a refusal */
let planBlocked = false;            /* G/H moved: nothing may be assigned until it is back */
let writerGen = 0;                  /* the generation this device writes under */
let writerHeld = true;              /* false once the sheet says another device is active */
let takeoverPending = false;        /* took over, but the authoritative state is not in yet */
/* Work that predates another device's writing. A read saying "you are the
   writer" is not enough to make it sendable again — a takeover whose answer was
   lost would otherwise leave this phone active and carrying a snapshot from
   before the other device's work. Only the full takeover flow clears it. */
let staleDirty = false;
let troubleSince = 0;               /* when the current run of failures began */
let flashSeq = 0;
let wokeAt = 0;                     /* when the app last came back to life */

/* ------------------------------------------------------------------ state -- */

const seatOf = (id) => (seated[id] === undefined ? null : Number(seated[id]));
const arrivedCount = () => Object.keys(seated).length;

function takenRows() {
  const t = new Set();
  for (const id in seated) t.add(Number(seated[id]));
  return t;
}
function nextSeat() {
  const taken = takenRows();
  return seats.find((s) => !taken.has(s.row)) || null;
}
/* Seats are consumed in order, so the last check-in holds the last occupied
   seat. Derived, so it survives a reload and cannot drift from the state. */
function lastOccupied() {
  const taken = takenRows();
  for (let i = seats.length - 1; i >= 0; i--) if (taken.has(seats[i].row)) return seats[i];
  return null;
}
function guestAtSeat(row) {
  for (const id in seated) if (Number(seated[id]) === row) return guests.find((g) => g.id === id) || null;
  return null;
}

/* ------------------------------------------------------------------ cache -- */

function save() {
  try {
    localStorage.setItem(CACHE(), JSON.stringify({
      v: CACHE_V, t: Date.now(), rev: rev, seq: seq, seated: seated, dirty: dirty,
      /* structure too, or a cold offline open has nothing to render */
      status: status, savedAt: savedAt, guests: guests, seats: seats,
      /* a reload must not forget a mismatch it has already seen */
      planBlocked: planBlocked,
      writerGen: writerGen, writerHeld: writerHeld, takeoverPending: takeoverPending,
      staleDirty: staleDirty
    }));
  } catch (e) {}
}
/* Raising the block must never be the thing that destroys the cache. pull()
   can return plan_changed before the cached event has been read into globals,
   and save() would then write empty guests, seats and seated over a perfectly
   good entry — taking any unsaved check-ins with it. The timestamp is left
   alone deliberately: the entry's age should say when the event data was last
   real, not when a plan change was noticed. */
function markBlocked() {
  planBlocked = true;
  if (loaded) { save(); return; }          /* globals are real; a full save is safe */
  try {
    const raw = localStorage.getItem(CACHE());
    if (!raw) return;                      /* nothing cached, nothing to preserve */
    const r = JSON.parse(raw);
    r.planBlocked = true;
    localStorage.setItem(CACHE(), JSON.stringify(r));
  } catch (e) {}
}

function loadCache() {
  try {
    const r = JSON.parse(localStorage.getItem(CACHE()));
    if (!r || r.v !== CACHE_V || !Number.isFinite(r.t) || Date.now() - r.t > KEEP_MS) {
      localStorage.removeItem(CACHE());
      return null;
    }
    return r;
  } catch (e) { return null; }
}
/* Every event leaves an entry behind and only the tab being opened was ever
   checked for expiry, so the rest stayed forever. */
function sweepCaches() {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k || k.indexOf("st_checkin_") !== 0) continue;
      let t = 0;
      try { t = (JSON.parse(localStorage.getItem(k)) || {}).t || 0; } catch (e) {}
      if (!Number.isFinite(t) || Date.now() - t > KEEP_MS) localStorage.removeItem(k);
    }
  } catch (e) {}
}

/* -------------------------------------------------------------- transport -- */

function withDeadline(promise, ctrl, ms) {
  return new Promise(function (resolve, reject) {
    const t = setTimeout(function () {
      try { ctrl.abort(); } catch (e) {}
      reject(new Error("the sheet did not answer in " + (ms / 1000) + "s"));
    }, ms);
    promise.then((v) => { clearTimeout(t); resolve(v); },
                 (e) => { clearTimeout(t); reject(e); });
  });
}

async function pull(authoritative) {
  const ctrl = new AbortController();
  const t0 = clock();
  let res;
  try {
    res = await withDeadline(
      fetch(API + "?tab=" + encodeURIComponent(TAB) + "&k=" + encodeURIComponent(KEY) +
            "&device=" + encodeURIComponent(DEVICE),
            { cache: "no-store", signal: ctrl.signal }),
      ctrl, loadCache() ? READ_MS : FIRST_READ_MS);
  } catch (e) {
    mark("read", clock() - t0, "failed", String(e.message || e).slice(0, 40));
    if (DEBUG) probeOther();
    throw e;
  }
  mark("read", clock() - t0, "ok", hop(API));
  const data = await res.json();
  /* Carry the flag: a refusal from the sheet and an unreachable sheet need
     different words, even though both fall back to the cache. */
  if (data.error) {
    const err = new Error(data.error);
    err.hard = !!data.hard; err.code = data.code;
    /* Set here rather than at a call site: reload() swallows pull errors, so a
       wake read that spotted the mismatch used to be discarded in silence. */
    if (data.code === "plan_changed") { markBlocked(); render(); }
    throw err;
  }

  planBlocked = false;                 /* the read succeeded, so the plan is back */
  guests = data.guests || [];
  seats  = data.seats  || [];
  status = data.status || "open";
  savedAt = data.savedAt || "";

  const cached = loadCache();
  const sameEvent = cached && String(cached.rev || "") === String(data.rev || "");
  const serverSeq = Number(data.seq || 0);

  /* A rebuilt tab is a different event; nothing about the old one carries in. */
  if (!sameEvent) staleDirty = false;
  /* The latch has to come back on an ordinary reload too, not only when the
     app boots offline from cache. Without this, reloading a phone whose
     takeover answer was lost would find the server saying "you are the writer"
     and quietly make its pre-takeover snapshot sendable again. */
  else if (cached.staleDirty) staleDirty = true;

  /* Who may write. A phone that finds another device active keeps everything
     it has — it simply stops being allowed to send it. */
  const w = data.writer || { exists: false, generation: 0, mine: false };
  const elsewhere = !!w.exists && !w.mine;

  /* Learning from a READ that another device is writing is enough to latch, and
     has to be: a phone that boots cold into this situation never sees a
     writer_conflict, so without this its takeover could reach the server, lose
     the answer, and the next read would hand it back the writer with the old
     snapshot still loaded. */
  if (elsewhere && (dirty || (!authoritative && sameEvent && !!cached.dirty)))
    staleDirty = true;

  writerHeld = !elsewhere && !staleDirty;
  if (writerHeld) writerGen = Number(w.generation || 0);

  /* The counter travels with the state it belongs to — never the cache's
     assignments stamped with the sheet's higher counter, which would write old
     state labelled newest and reintroduce exactly what the counter prevents.
     A cache holding unsaved work is ahead of the sheet by construction; there
     is no other writer. Anything else, the sheet is at least as current. */
  /* A takeover deliberately ignores the cache: its whole point is to continue
     from what the sheet holds, not to push whatever this phone was carrying.
     The dirty copy is already safe in a Recovery backup by the time we get
     here.

     Otherwise dirty always wins, whatever the sheet's counter says. Comparing
     counters here meant that once another device had written twice, this
     phone's unsaved work was quietly replaced by a read — the one thing that
     must never happen to work the sheet has never seen. It cannot be pushed
     while another device holds the writer, so keeping it costs nothing. */
  if (!authoritative && sameEvent && cached.dirty) {
    seated = cached.seated || {};
    seq = Number(cached.seq || 0);
    dirty = true;
  } else {
    seated = data.seated || {};
    seq = serverSeq;
    dirty = false;
  }
  rev = String(data.rev || "");

  /* an assignment pointing at a seat the plan no longer has cannot be shown */
  const rows = new Set(seats.map((s) => s.row));
  let dropped = 0;
  /* Only when nothing is pending. Dropping an assignment the sheet has never
     seen would lose it for good — and the refusal message tells the host to
     restore G/H, which they cannot do if reading the sheet already threw the
     assignment away. Unsavable but visible beats silently gone. */
  if (!dirty) {
    for (const id in seated) if (!rows.has(Number(seated[id]))) { delete seated[id]; dropped++; }
  }

  if (authoritative) takeoverPending = false;   /* the state is in; carry on */
  loaded = true;
  /* A read that lands retracts what a READ last said — unreachable, malformed.
     It says nothing about a refused save, and the re-read that follows a
     refusal would otherwise wipe the message explaining it. That clears when
     the save itself succeeds. A notice is about something already done. */
  if (bannerKind !== "notice" && !saveRefused) setBanner("");
  /* after the clear above, not before: this must not be the thing that gets
     cleared. Silently losing someone's seat is not something to do quietly. */
  if (dropped) setBanner(dropped + (dropped === 1 ? " assignment was" : " assignments were") +
    " removed — those seats are no longer in the plan. Tap to dismiss.", "notice");
  save();
}

let saveStarted = 0;               /* so a failure can report how long it hung */

async function push() {
  const ctrl = new AbortController();
  const t0 = clock();
  saveStarted = t0;
  /* Three seconds in, while this request is still pending, ask the same host a
     trivial question on what must be a different connection. Diagnostics only. */
  const peek = DEBUG ? setTimeout(probeSameHost, 3000) : null;
  const res = await withDeadline(fetch(API, {
    method: "POST", redirect: "follow", signal: ctrl.signal,
    headers: { "Content-Type": "text/plain;charset=utf-8" },   /* avoids preflight */
    body: JSON.stringify({ key: KEY, tab: TAB, rev: rev, seq: seq, seated: seated,
                           guestCount: guests.length,
                           deviceId: DEVICE, writerGeneration: writerGen })
  }), ctrl, Date.now() - wokeAt < WAKE_FOR ? WAKE_MS : WRITE_MS)
    .finally(() => { if (peek) clearTimeout(peek); });
  mark("save", clock() - t0, "ok", hop(API));
  wokeAt = 0;                       /* one round trip done: be patient again */
  const out = await res.json();
  /* The endpoint says whether it refused on purpose. Treating every JSON error
     as permanent was wrong: respond() also catches what Google raises — a lock
     timeout, a transient Sheets failure — and stopping the retry on one of
     those would leave an event unsaved with nothing prompting another attempt.
     Unmarked means retry, which is the harmless direction. */
  if (out.error) {
    const err = new Error(out.error);
    err.hard = !!out.hard; err.code = out.code;
    throw err;
  }
  savedAt = out.savedAt || savedAt;
  if (out.generation) writerGen = Number(out.generation);   /* the first save claims it */
  return out;
}

/* Everything this phone believes, in one object, so a Recovery backup can be
   exported later without the live state. */
function snapshotNow() {
  return { t: Date.now(), rev: rev, seq: seq, savedAt: savedAt,
           seated: JSON.parse(JSON.stringify(seated)),
           guests: JSON.parse(JSON.stringify(guests)),
           seats: JSON.parse(JSON.stringify(seats)) };
}

/* Written only in one circumstance: this phone is not the writer, it holds work
   the sheet never received, and the host has just chosen to take over — which
   is about to replace that work with the sheet's. Never on an ordinary switch,
   never merely because a phone is dirty. */
function saveRecovery(snap) {
  /* Read back, not just written. A quota failure used to be swallowed, and the
     takeover then cleared the very state the backup was meant to hold. */
  try {
    const key = RECOVERY() + snap.t;
    localStorage.setItem(key, JSON.stringify(snap));
    return !!localStorage.getItem(key);
  } catch (e) { return false; }
}

function recoveries() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf(RECOVERY()) !== 0) continue;
      try {
        const r = JSON.parse(localStorage.getItem(k));
        if (r && Number.isFinite(r.t)) out.push({ key: k, snap: r });
      } catch (e) {}
    }
  } catch (e) {}
  return out.sort((a, b) => a.snap.t - b.snap.t);
}

/* Make this phone the writer, then continue from what the sheet holds — never
   from what this phone was carrying. The order matters: hold the dirty copy,
   take the lock, only then persist it, and only then go looking for the truth.
   A takeover that succeeds and a read that fails must leave the phone unable to
   check anyone in rather than able to push a stale snapshot. */
async function takeOver() {
  /* Never folded into the generic wanted -> sync() path: that would queue a
     save, not a takeover, and the tap would vanish. The button is disabled
     while anything is in flight, so this is only a guard. */
  if (busy || takeoverPending || status === "done") return;
  busy = true;
  render();                     /* before awaiting anything: the button must go
                                   dead on screen, not merely in a guard */
  const held = dirty ? snapshotNow() : null;
  try {
    const ctrl = new AbortController();
    const res = await withDeadline(fetch(API, {
      method: "POST", redirect: "follow", signal: ctrl.signal,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "takeover", key: KEY, tab: TAB, rev: rev, deviceId: DEVICE })
    }), ctrl, WRITE_MS);
    const out = await res.json();
    if (out.error) {
      const err = new Error(out.error); err.hard = !!out.hard; err.code = out.code; throw err;
    }

    /* Nothing is discarded until the backup is on disk. If it cannot be stored,
       the phone keeps its work, stays unable to write, and says so — the server
       has moved the writer, which is harmless because nothing will be sent. */
    if (held && !saveRecovery(held)) {
      writerHeld = false; staleDirty = true;
      setBanner("Could not save a backup of this phone's unsaved check-ins — " +
                "nothing was changed. Export them, then try again.", "hard");
      save(); busy = false; render();
      return;
    }
    writerGen = Number(out.generation || 0);
    writerHeld = true;
    /* Nothing of the old state may survive into the new one, not even on screen:
       what is shown must be what the sheet says once the read lands. */
    seated = {}; dirty = false; saveRefused = false; staleDirty = false;
    takeoverPending = true;
    setBanner("");
    save();
  } catch (e) {
    setBanner(e.message, e.hard ? "hard" : "net");
    busy = false; render();
    return;
  }
  busy = false;
  await loadAuthoritative();
}

/* Retried until it lands. Until then nobody can be checked in, because the
   phone does not yet know who is already seated. */
async function loadAuthoritative() {
  if (busy) { wanted = true; return; }
  busy = true; render();
  try {
    await pull(true);
    /* Now that the truth is in, the backup can say how much it holds. */
    labelLatestRecovery();
  } catch (e) {
    setBanner("Loading the latest check-in state…", "info");
  } finally { busy = false; render(); }
}

/* The count is the one thing that cannot be known when the backup is written,
   so it is filled in once the authoritative state arrives. The snapshot itself
   is never altered. */
function labelLatestRecovery() {
  const all = recoveries();
  const last = all[all.length - 1];
  if (!last || last.snap.unsaved !== undefined) return;
  let n = 0;
  for (const id in last.snap.seated) {
    if (Number(seated[id]) !== Number(last.snap.seated[id])) n++;
  }
  last.snap.unsaved = n;
  try { localStorage.setItem(last.key, JSON.stringify(last.snap)); } catch (e) {}
}

/* One gate, so a read and a write never overlap, and a request made while it is
   held is remembered rather than lost. */
async function sync() {
  if (busy) { wanted = true; return; }
  /* Nothing may be written while the sheet's plan differs from the one these
     seats came from. The work stays local and stays exportable. */
  if (planBlocked || !writerHeld || takeoverPending) return;
  if (!loaded || !dirty) return;
  busy = true; saving = true;
  showProgress(true);
  render();
  try {
    const before = JSON.stringify(seated);
    await push();
    /* only clean if nothing changed while the write was in flight */
    if (JSON.stringify(seated) === before) dirty = false;
    /* Only worth announcing if the host had been told something was wrong. */
    const recovered = troubleSince > 0;
    troubleSince = 0;
    saveRefused = false;
    if (recovered) flash("Saved", "ok"); else setBanner("");
    save();
  } catch (e) {
    saveRefused = !!e.hard;
    refetch = !!e.hard;
    if (e.hard) {
      troubleSince = 0;                    /* only the host can clear this one */
      /* Another device is writing. Everything here stays exactly as it is —
         above all, no re-read, because that is what would replace unsaved work
         with the sheet's version of events. Taking over is the only way back,
         and it is the host's decision, not the app's. */
      if (e.code === "writer_conflict") {
        writerHeld = false; refetch = false;
        if (dirty) staleDirty = true;   /* only a takeover may make this sendable */
        save();
      }
      /* Seats were handed out from a plan that has since moved. Assigning more
         from the plan now in the sheet would put someone where the app cannot
         later find them, so nothing new is given out until a read says the
         original is back. Existing local work is kept and still exportable. */
      /* Persisted at once. The read that normally follows would save it, but a
         page closed in that gap would reopen offline having forgotten. */
      if (e.code === "plan_changed") markBlocked();
      setBanner(e.message, "hard");
    } else {
      /* the network: no message and no red, just how long it has been trying */
      if (!troubleSince) troubleSince = Date.now();
      mark("save", saveStarted ? clock() - saveStarted : 0, "failed",
           String(e.message || e).slice(0, 40));
      /* the decisive measurement: is the phone's network slow, or only this
         connection? Diagnostics only — it never runs at a real event. */
      if (DEBUG) probeOther();
      showProgress(false);
    }
  } finally {
    busy = false; saving = false; render();
    /* A refusal means the sheet is not what we assumed — its status or its
       seating plan may have changed. One read to find out, and only one, so it
       cannot chase its own tail. */
    if (refetch) { refetch = false; setTimeout(reload, 0); }
    if (wanted) { wanted = false; setTimeout(sync, 0); }
  }
}

/* Keeps the endpoint awake so a real save does not pay a cold start. Skipped
   whenever something is already pending — the retry loop is keeping it warm on
   its own — and whenever the app is hidden or the event is over. */
function warm() {
  if (!loaded || dirty || busy || status === "done" || document.hidden) return;
  const ctrl = new AbortController();
  const t0 = clock();
  withDeadline(
    fetch(API + "?tab=" + encodeURIComponent(TAB) + "&ping=1",
          { cache: "no-store", signal: ctrl.signal }),
    ctrl, 8000)
    .then(() => mark("ping", clock() - t0, "ok"))
    .catch((e) => mark("ping", clock() - t0, "failed", String(e.message || e).slice(0, 30)));
}

/* Structure and status, without touching the queue of intent. Used when the
   phone comes back to life: a seat added to G/H or a status flipped to done is
   picked up without the host having to reload. */
async function reload() {
  /* Unsaved work goes first — but never a snapshot the sheet has already
     refused. A refusal schedules this read, and re-sending on the way in made
     it a chain: POST, refused, schedule, POST. The busy gate serialised those
     cycles without ending them; measured, one refusal produced 187 of them.
     After a refusal this reads and stops, and Save is the way back. */
  if (dirty && !saveRefused) await sync();
  if (busy) { wanted = true; return; }
  busy = true; render();
  try { await pull(); } catch (e) {} finally { busy = false; render(); }
}

/* ----------------------------------------------------------------- action -- */

function checkIn(guest) {
  if (status === "done" || planBlocked || !writerHeld || takeoverPending) return;
  if (seatOf(guest.id) !== null) return;
  const seat = nextSeat();
  if (!seat) { setBanner("No seats left in the plan — add rows to the sheet.", "hard"); return; }
  if (seat.colour !== "purple" && seat.colour !== "yellow") {
    setBanner('Seat at table ' + seat.table + ' has colour "' + seat.colour + '" — fix the sheet.', "hard");
    return;
  }
  seated[guest.id] = seat.row;
  seq++; dirty = true; save();
  showCard(seat, guest); render(); sync();
}

function undo() {
  if (status === "done" || planBlocked || !writerHeld || takeoverPending) return;
  const seat = lastOccupied();
  if (!seat) return;
  const g = guestAtSeat(seat.row);
  if (!g) return;
  delete seated[g.id];
  seq++; dirty = true; save(); render(); sync();
}

/* A host holding the door does not want the screen dimming between guests.
   The lock needs a real gesture, and iOS drops it whenever the page is hidden,
   so it is taken on any tap and taken again on return. */
async function keepAwake() {
  try {
    if (!("wakeLock" in navigator) || wake || document.hidden) return;
    wake = await navigator.wakeLock.request("screen");
    wake.addEventListener("release", () => { wake = null; });
  } catch (e) { wake = null; }
}
document.addEventListener("pointerdown", keepAwake, { passive: true });

/* ------------------------------------------------------------------- view -- */

function showCard(seat, guest) {
  const c = $("card");
  c.className = seat.colour;
  $("cardcolour").textContent = seat.colour === "yellow" ? "Yellow" : "Purple";
  $("cardtable").textContent = seat.table;
  $("cardname").textContent = guest.name;
  c.hidden = false;
}
$("cardclose").onclick = () => { $("card").hidden = true; $("q").value = ""; render(); };

/* Tagged, so a recovered connection clears only the connectivity message and
   leaves a genuine one alone. */
/* A slow save and a dead connection are not the same thing, and calling both
   "offline" is wrong on a phone that is plainly online. Apps Script wakes cold
   in anything up to 30s, so a long save on a good connection is ordinary. */
function showProgress(active) {
  const t = troubleSince ? Date.now() - troubleSince : 0;
  const off = navigator.onLine === false;
  /* An attempt actually running says so, whatever the trouble clock reads —
     otherwise the bar still said "offline" while the save was already going
     through. Not while the phone has no connection, though: there the attempt
     fails in a millisecond and this would just flicker every few seconds. */
  if (active && !off) { setBanner("Saving…", "info"); return; }
  if (t > OFFLINE_AT)
    setBanner(off ? "No connection — this will save as soon as there is one"
                  : "Still saving — the sheet is slow to answer. Nothing is lost.", "warn");
  else if (t > RETRY_AT) setBanner("Still trying to save…", "info");
  else                   setBanner("Saving…", "info");
}

/* Says its piece and leaves. Tokened so a later banner is never wiped by an
   older flash's timer. */
function flash(msg, kind) {
  setBanner(msg, kind);
  const mine = ++flashSeq;
  setTimeout(() => { if (mine === flashSeq && bannerKind === kind) setBanner(""); }, FLASH_MS);
}

function setBanner(msg, kind) {
  bannerKind = msg ? (kind || "") : "";
  const b = $("banner");
  b.hidden = !msg;
  b.className = ["info", "warn", "ok"].indexOf(bannerKind) !== -1 ? bannerKind : "";
  b.textContent = msg || "";
}

function render() {
  const n = arrivedCount();
  $("n").textContent = n;
  $("total").textContent = guests.length;
  const p = $("parity");
  p.textContent = n === 0 ? "" : (n % 2 ? "odd" : "even");
  p.className = "parity " + (n % 2 ? "odd" : "even");

  const seat = lastOccupied();
  const who  = seat ? guestAtSeat(seat.row) : null;
  if (seat && who) {
    $("last").innerHTML = "Last: <b>" + esc(who.name) + "</b><i>" +
      esc(seat.colour) + " table " + esc(seat.table) + "</i>";
  } else {
    $("last").textContent = loaded ? "No check-ins yet." : "Loading…";
  }
  $("undo").disabled = !(seat && who) || status === "done" || planBlocked ||
                       !writerHeld || takeoverPending;

  const st = $("sync");
  if (!loaded)            { st.className = "";        st.textContent = "Loading…"; }
  else if (status === "done") { st.className = "";    st.textContent = "Event finished — check-in disabled"; }
  else if (planBlocked)   { st.className = "pending"; st.textContent = "Seating plan changed — restore G and H"; }
  else if (takeoverPending) { st.className = ""; st.textContent = "Loading the latest check-in state…"; }
  else if (!writerHeld)   { st.className = "pending"; st.textContent = "Another phone has taken over this event"; }
  /* The step that was missing. A write can take seconds on venue wifi, and
     calling that "Not saved" reads as broken when it is simply in progress. */
  else if (saving)        { st.className = "";        st.textContent = "Saving…"; }
  else if (dirty)         { st.className = "pending";
                            st.textContent = (troubleSince && Date.now() - troubleSince > OFFLINE_AT
                              ? (navigator.onLine === false ? "Waiting for a connection" : "Still saving")
                              : "Not saved") +
                              (savedAt ? " — last saved " + savedAt : ""); }
  else                    { st.className = "saved";   st.textContent = "Saved" + (savedAt ? " " + savedAt : ""); }
  $("push").disabled = saving || !dirty || status === "done" || planBlocked ||
                       !writerHeld || takeoverPending;
  /* Every non-writing device gets the same button; there is no "original" phone.
     Hidden while a takeover is already loading, and on a finished event, where
     the server would refuse it anyway. */
  $("over").hidden = writerHeld || takeoverPending || status === "done";
  $("over").disabled = busy;
  $("push").textContent = saving ? "Saving…" : "Save";

  const q = fold($("q").value.trim());
  const shown = q ? guests.filter((g) =>
    fold(g.name).includes(q) || fold(g.email).includes(q) || fold(g.phone).includes(q)) : guests;

  if (!shown.length) {
    setList('<div class="empty">' + (loaded ? "No one matches that." : "") + "</div>");
    return;
  }
  setList(shown.map((g) => {
    const row = seatOf(g.id);
    const s = row ? seats.find((x) => x.row === row) : null;
    const meta = [g.email, g.phone].filter(Boolean)
      .map((v) => "<span>" + esc(v) + "</span>").join("");
    return '<div class="row' + (row ? " done" : "") + '" data-id="' + esc(g.id) + '">' +
      '<div class="who"><div class="nm">' + esc(g.name) + "</div>" +
      (meta ? '<div class="meta">' + meta + "</div>" : "") + "</div>" +
      (row
        ? '<div class="seatn">' + esc(s ? s.colour + " " + s.table : "in") + "</div>"
        : '<button class="go" type="button"' +
          (status === "done" || planBlocked || !writerHeld || takeoverPending ? " disabled" : "") +
          ">Check in</button>") +
      "</div>";
  }).join(""));
}

/* Rewriting innerHTML drops the scroll position, and render() runs on every
   save, every wake and every keystroke — so the list jumped under the host's
   finger while nothing about it had changed. Write only on a real change. */
let lastList = null;
function setList(html) {
  if (html === lastList) return;
  lastList = html;
  $("list").innerHTML = html;
}

/* ----------------------------------------------------------------- export -- */

/* Everything this phone believes, including anything the sheet has never seen.
   Both columns are rebuilt from the same state, so the file is consistent even
   if nothing was ever saved. */
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* Same columns, same order, from either the live state or a preserved one. */
function buildCSV(snap) {
  const gs = snap ? snap.guests : guests;
  const ss = snap ? snap.seats  : seats;
  const sd = snap ? snap.seated : seated;
  const seatIn = (id) => (sd[id] === undefined ? null : Number(sd[id]));
  const whoIn = (row) => {
    for (const id in sd) if (Number(sd[id]) === row) return gs.find((x) => x.id === id) || null;
    return null;
  };
  const rows = [["guest_id", "name", "email", "phone", "check-in", "", "colour", "table", "guest"]];
  const n = Math.max(gs.length, ss.length);              /* two independent blocks */
  for (let i = 0; i < n; i++) {
    const g = gs[i], s = ss[i];
    const row = g ? seatIn(g.id) : null;
    const seat = row ? ss.find((x) => x.row === row) : null;
    const occ = s ? whoIn(s.row) : null;
    rows.push([
      g ? g.id : "", g ? g.name : "", g ? g.email : "", g ? g.phone : "",
      seat ? seat.colour + " " + seat.table : "", "",
      s ? s.colour : "", s ? s.table : "", occ ? occ.name : ""
    ]);
  }
  return rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
}
/* One button. With nothing preserved it behaves exactly as it always has; with
   a backup present it asks which one first. */
async function exportCSV() {
  const recs = recoveries();
  if (!recs.length) return shareCSV(null);
  openChooser(recs);
}

const two = (n) => (n < 10 ? "0" : "") + n;
function stamp(t) { const d = new Date(t); return two(d.getHours()) + ":" + two(d.getMinutes()); }
function fileStamp(t) {
  const d = new Date(t);
  return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate()) +
         "-" + two(d.getHours()) + two(d.getMinutes());
}

function openChooser(recs) {
  const rows = ['<button class="pick" data-i="-1"><b>Current check-in</b></button>'];
  recs.forEach((r, i) => {
    const n = r.snap.unsaved;
    const what = (typeof n === "number" && n > 0)
      ? n + (n === 1 ? " unsaved check-in" : " unsaved check-ins")
      : "Unsaved local changes";
    rows.push('<button class="pick" data-i="' + i + '"><b>Recovery backup</b>' +
      '<span>' + esc(what) + " · saved " + stamp(r.snap.t) + "</span></button>");
  });
  $("pickrows").innerHTML = rows.join("");
  $("chooser").hidden = false;
  $("pickrows").onclick = (ev) => {
    const b = ev.target.closest(".pick");
    if (!b) return;
    const i = Number(b.dataset.i);
    $("chooser").hidden = true;
    shareCSV(i < 0 ? null : recs[i].snap);
  };
}
$("pickclose").onclick = () => { $("chooser").hidden = true; };

async function shareCSV(snap) {
  const name = snap
    ? (TAB || "checkin") + "-recovery-" + fileStamp(snap.t) + ".csv"
    : (TAB || "checkin") + "-backup.csv";
  const text = buildCSV(snap);
  const file = new File([text], name, { type: "text/csv" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$("save").onclick = exportCSV;
$("over").onclick = takeOver;
$("push").onclick = () => { if (dirty) sync(); };

/* one listener for the whole list, so re-rendering never leaves handlers behind */
$("list").addEventListener("click", (e) => {
  const btn = e.target.closest(".go");
  if (!btn || btn.disabled) return;
  const g = guests.find((x) => x.id === btn.closest(".row").dataset.id);
  if (g) checkIn(g);
});
$("list").addEventListener("pointerdown", (e) => {
  const btn = e.target.closest(".go");
  if (btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 140); }
});
$("q").addEventListener("input", render);
$("undo").onclick = undo;

/* ------------------------------------------------------------------- boot -- */

(async function start() {
  if (!TAB) { setBanner("No event given. Add ?tab=your-tab-name to the URL.", "hard"); return; }
  /* Without a key there is nothing to show. Booting into the cached guest list
     would hand attendee names, emails and phone numbers to a link that has no
     right to them. */
  if (!KEY) { setBanner("Access denied — this link is missing its key.", "hard"); return; }
  sweepCaches();

  try {
    await pull();
  } catch (e) {
    /* No sheet. Only a cache holding unsaved work is worth showing — a clean one
       has nothing the sheet lacks, and structure has to come from the sheet. */
    /* The fallback is the same either way — locking the host out of the door
       over a spreadsheet cell would be far worse than working from the last
       good copy, and a save will refuse with the same reason anyway. Only the
       wording differs, so nobody goes to check their wifi over a blank K2. */
    /* A refused key is never a reason to fall back: cached attendee data is
       exactly what the key exists to protect. */
    if (e.code === "auth") {
      setBanner("Access denied — " + e.message, "hard");
      render();
      return;
    }
    const cached = loadCache();
    if (cached && cached.guests && cached.guests.length) {
      guests = cached.guests; seats = cached.seats || [];
      seated = cached.seated || {}; rev = String(cached.rev || "");
      status = cached.status || "open"; savedAt = cached.savedAt || "";
      seq = Number(cached.seq || 0);
      planBlocked = !!cached.planBlocked;
      writerGen = Number(cached.writerGen || 0);
      writerHeld = cached.writerHeld !== false;
      takeoverPending = !!cached.takeoverPending;
      staleDirty = !!cached.staleDirty;
      dirty = !!cached.dirty; loaded = true;
      setBanner(e.hard
        ? "Sheet problem — " + e.message + " Working from the last saved copy."
        : "Working offline — " + e.message, e.hard ? "hard" : "net");
    } else {
      setBanner(e.hard ? "Sheet problem — " + e.message
                       : "Cannot reach the sheet: " + e.message, e.hard ? "hard" : "net");
    }
  }
  render();
  if (dirty) sync();

  /* Not polling: this only reaches the network when the phone holds unsaved
     work, which is the retry the offline model depends on. */
  /* Backs off only when the sheet itself refused. Every other trigger — a
     check-in, Save, reconnecting, reopening — still attempts regardless.

     This is also what actually notices a connection coming back: Safari's
     online event is unreliable after airplane mode. Cheap, because it only
     touches the network when something is unsaved and sync() returns at once
     if an attempt is already running. */
  setInterval(() => {
    if (takeoverPending) { loadAuthoritative(); return; }
    if (dirty && !saveRefused) sync();
  }, 5000);
  setInterval(warm, WARM_MS);
  warm();                       /* warm before the first guest, not after */
  const cameBack = () => { wokeAt = Date.now(); reload(); };
  window.addEventListener("online", cameBack);
  window.addEventListener("pageshow", cameBack);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    keepAwake();          /* iOS drops the lock while hidden */
    cameBack();
  });

  /* Registration used to fail in silence, so a missing or stale sw.js looked
     exactly like a working one until the first offline reload. */
  /* Silent when all is well. It appears only when offline genuinely will not
     work — which the host should know before the venue wifi dies — or when
     &debug=1 is on the URL, so the build can still be read in two seconds if
     anything ever looks wrong. */
  const DEBUG = params.get("debug") === "1";
  const swState = () => {
    const on = navigator.serviceWorker && navigator.serviceWorker.controller;
    setText("build", on && !DEBUG ? ""
      : "build " + BUILD + (on ? " · offline ready" : " · offline not ready"));
  };
  swState();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      /* Take the update now rather than on some later visit — otherwise a
         redeploy is invisible until the tab has been closed twice. */
      if (reg.waiting) reg.waiting.postMessage("claim");
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (w) w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) w.postMessage("claim");
        });
      });
      swState();
    }).catch(() => {
      setText("build", "build " + BUILD + " · offline unavailable (sw.js not found)");
    });
    navigator.serviceWorker.addEventListener("controllerchange", swState);
  } else {
    setText("build", "build " + BUILD + " · offline unsupported");
  }
})();
