<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe6f6">
<title>SpeakTiger check-in</title>
<style>
  :root {
    --bg:      #dbe6f6;
    --card:    #ffffff;
    --fg:      #14161c;
    --dim:     #38445c;
    --muted:   #78849a;
    --line:    #b9c9e2;
    --accent:  #3d81e8;
    --move:    #b84ae0;   /* purple, exactly the guest app's */
    --stay:    #f0cf3a;   /* yellow */
    --onmove:  #ffffff;
    --onstay:  #14161c;
    --good:    #2f7a4a;
    --warn:    #c2410c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; border: 0; cursor: pointer; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .count { font-size: 22px; font-weight: 850; letter-spacing: -.02em; }
  .count small { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .parity { font-size: 13px; font-weight: 850; text-transform: uppercase; letter-spacing: .1em; }
  .parity.odd  { color: var(--warn); }
  .parity.even { color: var(--good); }

  .last { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 34px; }
  .last-txt { flex: 1; font-size: 13px; color: var(--dim); font-weight: 600; }
  .last-txt b { color: var(--fg); }
  #undo {
    background: var(--bg); color: var(--dim); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; font-weight: 800;
  }
  #undo:disabled { opacity: .35; }
  #save { background: var(--bg); color: var(--dim); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 800; }

  #sync { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  #sync.pending { color: var(--warn); }
  #sync.saved   { color: var(--good); }

  #q {
    width: 100%; margin-top: 10px; padding: 13px 14px; font-size: 17px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--fg);
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* ---------- list ---------- */
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 24px; }
  .row {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  }
  .row.done { background: #eaf4ec; }
  .who { flex: 1; min-width: 0; }
  .nm { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .row.done .nm { color: var(--good); }
  /* secondary by design: it exists to tell two people of the same name apart */
  .meta { margin-top: 2px; font-size: 12.5px; color: var(--muted); font-weight: 600;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .go {
    flex: 0 0 auto; background: var(--accent); color: #fff; border-radius: 11px;
    padding: 12px 16px; font-size: 15px; font-weight: 800;
    transition: transform .12s ease, filter .12s ease;
  }
  .go.pressed { transform: scale(.95); filter: brightness(.9); transition-duration: 0s; }
  .row.done .go { background: #d8e6dc; color: var(--good); }
  .seatn { font-size: 12px; font-weight: 800; color: var(--good); white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-weight: 700; padding: 40px 20px; }

  /* ---------- the sticky card ---------- */
  #card {
    position: fixed; inset: 0; z-index: 30; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    padding: 24px;
  }
  #card[hidden] { display: none; }
  #card.purple { background: var(--move); color: var(--onmove); }
  #card.yellow { background: var(--stay); color: var(--onstay); }
  #card .lbl { font-size: clamp(18px, 5vw, 30px); font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
  #card .tbl { font-size: clamp(90px, 42vw, 300px); font-weight: 900; line-height: .9; letter-spacing: -.04em; }
  #card .nm2 { font-size: clamp(16px, 4.4vw, 26px); font-weight: 750; opacity: .85; text-align: center; }
  #cardclose {
    background: rgba(255,255,255,.92); color: var(--fg); border-radius: 14px;
    padding: 16px 44px; font-size: 18px; font-weight: 850;
  }
  #card.yellow #cardclose { background: rgba(20,22,28,.9); color: #fff; }

  #banner {
    flex: 0 0 auto; background: var(--warn); color: #fff; text-align: center;
    padding: 8px 12px; font-size: 13px; font-weight: 800;
  }
  #banner[hidden] { display: none; }
</style>
</head>
<body>

<div id="banner" hidden></div>

<header>
  <div class="top">
    <div class="count"><span id="n">0</span> <small>of <span id="total">0</span> checked in</small></div>
    <div class="parity" id="parity"></div>
  </div>
  <div class="last">
    <div class="last-txt" id="last">No check-ins yet.</div>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="save" type="button" title="Export a CSV of everything this phone knows">Export</button>
  </div>
  <div id="sync">Loading…</div>
  <input id="q" type="search" placeholder="Search name, email or phone"
         autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
</header>

<main id="list"></main>

<div id="card" hidden>
  <div class="lbl" id="cardcolour"></div>
  <div class="tbl" id="cardtable"></div>
  <div class="nm2" id="cardname"></div>
  <button id="cardclose" type="button">Done</button>
</div>

<script>
/* ===========================================================================
   SpeakTiger check-in
   ---------------------------------------------------------------------------
   The seating plan is a queue of (colour, table) slots consumed in order. A
   guest arrives, takes the next free slot, and their name goes into it. There
   are only two pieces of state: who has arrived, and which slots that used.

   The door is the worst place in an event for a network dependency, so the
   sheet is read once and every check-in is answered from memory. Writes are
   queued and flushed; if the network dies the app keeps working and the sheet
   catches up. The sheet is the paper fallback's recovery document, so writes
   go out one at a time as they happen rather than batched at the end — a batch
   that never flushes is worthless in exactly the moment it is needed.
   =========================================================================== */

const API = "https://script.google.com/macros/s/AKfycbz1Rv9dOJM3C_REAckYe173wJ3-hmAH23llLRs85EP-HTlYWCVfEAb6l_WWd8a212Qv/exec";

const params = new URLSearchParams(location.search);
const TAB    = params.get("tab") || "";
const KEY    = params.get("k")   || "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* Folded the same way the sheet's builder sorts, so what the host types matches
   what they see. NFD alone misses these: Ł ø ß have no combining form. */
const fold = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\u0141/g, "L").replace(/\u0142/g, "l")
  .replace(/\u00d8/g, "O").replace(/\u00f8/g, "o")
  .replace(/\u00c6/g, "AE").replace(/\u00e6/g, "ae")
  .replace(/\u00df/g, "ss")
  .toLowerCase();

let guests = [], seats = [];
let queue = [];            /* writes not yet confirmed by the sheet */
let history = [];          /* check-ins this session, newest last — drives Undo */
let rev = "";              /* which build of this tab the cache belongs to */
let flushing = false, loaded = false, syncing = false;

const READ_MS = 5000;      /* a hung request must not leave the door staring at nothing */

function withDeadline(promise, ctrl, ms) {
  return new Promise(function (resolve, reject) {
    const t = setTimeout(function () {
      try { ctrl.abort(); } catch (e) {}
      reject(new Error("the sheet did not answer in " + (ms / 1000) + "s"));
    }, ms);
    promise.then(function (v) { clearTimeout(t); resolve(v); },
                 function (e) { clearTimeout(t); reject(e); });
  });
}

const CACHE = () => "st_checkin_" + TAB;
const KEEP_MS = 12 * 60 * 60 * 1000;

/* ------------------------------------------------------------------ state -- */

/* Derived, never stored: a seat is taken if the sheet says so or a queued write
   claims it. One source of truth means the queue position cannot drift out of
   step with what the sheet actually holds. */
function seatOf(guestId) {
  for (let i = queue.length - 1; i >= 0; i--) {
    if (queue[i].guestId === guestId) return queue[i].clear ? null : queue[i].seatRow;
  }
  const g = guests.find((x) => x.id === guestId);
  return g && g.seatRow ? Number(g.seatRow) : null;
}
function takenRows() {
  const t = new Set();
  seats.forEach((s) => { if (s.guest) t.add(s.row); });
  queue.forEach((w) => { if (w.clear) t.delete(w.seatRow); else t.add(w.seatRow); });
  return t;
}
function nextSeat() {
  const taken = takenRows();
  return seats.find((s) => !taken.has(s.row)) || null;
}
const arrivedCount = () => guests.filter((g) => seatOf(g.id) !== null).length;

/* ------------------------------------------------------------------ cache -- */

function save() {
  try {
    localStorage.setItem(CACHE(), JSON.stringify({
      t: Date.now(), rev: rev, guests: guests, seats: seats, queue: queue, history: history
    }));
  } catch (e) {}
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(CACHE()));
    /* expired entries are deleted, not merely refused — otherwise last month's
       event sits in storage until the browser decides otherwise */
    if (!r || !Number.isFinite(r.t) || Date.now() - r.t > KEEP_MS) {
      localStorage.removeItem(CACHE());
      return false;
    }
    guests = r.guests || []; seats = r.seats || [];
    queue = r.queue || []; history = r.history || [];
    rev = String(r.rev || "");
    return guests.length > 0;
  } catch (e) { return false; }
}

/* -------------------------------------------------------------- transport -- */

async function pull() {
  const ctrl = new AbortController();
  const res = await withDeadline(
    fetch(API + "?tab=" + encodeURIComponent(TAB), { cache: "no-store", signal: ctrl.signal }),
    ctrl, READ_MS);
  const data = await res.json();
  if (data.error) throw new Error(data.error);

  const fresh = String(data.rev || "");
  /* A rebuilt tab is a different event as far as the cache is concerned. An
     absent cached revision means this cache predates revisions — keep its queue
     and adopt the current one rather than throwing away real work. */
  if (rev && fresh && rev !== fresh) {
    if (queue.length) reportDiscarded();
    queue = []; history = [];
  }
  rev = fresh;

  guests = data.guests; seats = data.seats;
  /* Anything the sheet already confirms is dropped from the queue: reopening
     mid-event must land exactly where the sheet says, not replay old writes. */
  queue = queue.filter((w) => {
    const g = guests.find((x) => x.id === w.guestId);
    if (!g) return false;
    return w.clear ? !!g.seatRow : String(g.seatRow || "") !== String(w.seatRow);
  });
  loaded = true;
  /* Any read that lands proves the connection came back. Doing this inside
     pull() covers all three callers — boot, sync, and the reread after a
     backlog drains — which was the one that left the message up. */
  if (bannerKind === "net") setBanner("");
  save();
}

/* Named before they go, using the picture the cache still holds — the host
   cannot get them back, but they can check the paper. */
function reportDiscarded() {
  const lines = queue.map((w) => {
    const g = guests.find((x) => x.id === w.guestId);
    const s = seats.find((x) => x.row === w.seatRow);
    const who = (g ? g.name : w.guestId) + " — " + (s ? s.colour + " " + s.table : "?");
    return w.clear ? "Undo " + who : who;      /* an unsent undo is a lost action too */
  });
  if (lines.length) alert("Event tab was rebuilt. Unsent actions discarded:\n\n" + lines.join("\n"));
}

async function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  let sent = false;
  try {
    while (queue.length) {
      const w = queue[0];
      /* The same deadline the read has. Without it a request that hangs rather
         than fails leaves flushing=true for good: the retry timer returns
         immediately, and the queue never moves again until a reload. Venue wifi
         that is connected but dead looks exactly like this. */
      const ctrl = new AbortController();
      const res = await withDeadline(fetch(API, {
        method: "POST", redirect: "follow", signal: ctrl.signal,
        headers: { "Content-Type": "text/plain;charset=utf-8" },   /* avoids preflight */
        body: JSON.stringify({ key: KEY, tab: TAB, guestId: w.guestId, seatRow: w.seatRow, clear: !!w.clear })
      }), ctrl, READ_MS);
      const out = await res.json();
      if (out.error) { setBanner(out.error); break; }   /* a rejection is not a retry */
      sent = true;
      /* confirmed: fold it into the local picture so the queue can shrink */
      const g = guests.find((x) => x.id === w.guestId);
      if (g) g.seatRow = w.clear ? null : w.seatRow;
      const s = seats.find((x) => x.row === w.seatRow);
      if (s) s.guest = w.clear ? null : (g ? g.name : "");
      queue.shift();
      save(); render();
    }
  } catch (e) {
    /* offline: keep the queue, try again on the next tick */
  } finally {
    flushing = false;
    render();
  }
  /* Once, after the backlog drains — not after each write, or five queued
     check-ins would pull the whole sheet five times. */
  if (sent && !queue.length) { try { await pull(); } catch (e) {} render(); }
}

/* The only two things that reach for the sheet: a backlog to send, or nothing
   to send and a state worth refreshing. */
async function sync() {
  if (syncing) return;
  syncing = true;
  try {
    if (queue.length) await flush();
    else { try { await pull(); setBanner(""); } catch (e) {} }
  } finally { syncing = false; render(); }
}

/* ----------------------------------------------------------------- action -- */

function checkIn(guest) {
  if (seatOf(guest.id) !== null) return;
  const seat = nextSeat();
  if (!seat) { setBanner("No seats left in the plan — add rows to the sheet."); return; }
  /* Refused, not guessed. Treating anything non-yellow as purple is how a sheet
     saying "blue 1" ends up handing someone a purple card. */
  if (seat.colour !== "purple" && seat.colour !== "yellow") {
    setBanner('Seat at table ' + seat.table + ' has colour "' + seat.colour + '" — only purple or yellow. Fix the sheet.');
    return;
  }
  queue.push({ guestId: guest.id, seatRow: seat.row });
  history.push({ guestId: guest.id, seatRow: seat.row });
  save(); showCard(seat, guest); render(); flush();
}

function undo() {
  const last = history[history.length - 1];
  if (!last) return;
  history.pop();
  queue.push({ guestId: last.guestId, seatRow: last.seatRow, clear: true });
  save(); render(); flush();
}

/* ------------------------------------------------------------------- view -- */

function showCard(seat, guest) {
  const c = $("card");
  c.className = seat.colour;                       /* already validated in checkIn */
  $("cardcolour").textContent = seat.colour === "yellow" ? "Yellow" : "Purple";
  $("cardtable").textContent = seat.table;
  $("cardname").textContent = guest.name;
  c.hidden = false;
}
$("cardclose").onclick = () => { $("card").hidden = true; $("q").value = ""; render(); };

/* Tagged, so a recovered connection clears only the connectivity message and
   leaves a genuine one — a refused write, a seating plan that ran out — alone. */
let bannerKind = "";
function setBanner(msg, kind) {
  bannerKind = msg ? (kind || "") : "";
  const b = $("banner");
  b.hidden = !msg;
  b.textContent = msg || "";
}

function render() {
  const n = arrivedCount();
  $("n").textContent = n;
  $("total").textContent = guests.length;
  const p = $("parity");
  p.textContent = n === 0 ? "" : (n % 2 ? "odd" : "even");
  p.className = "parity " + (n % 2 ? "odd" : "even");

  const last = history[history.length - 1];
  if (last) {
    const g = guests.find((x) => x.id === last.guestId);
    const s = seats.find((x) => x.row === last.seatRow);
    $("last").innerHTML = "Last: <b>" + esc(g ? g.name : "?") + "</b> · " +
      esc(s ? s.colour : "?") + " table " + esc(s ? s.table : "?");
  } else {
    $("last").textContent = loaded ? "No check-ins yet." : "Loading…";
  }
  $("undo").disabled = !last;

  const sync = $("sync");
  if (!loaded)          { sync.className = "";        sync.textContent = "Loading…"; }
  else if (queue.length){ sync.className = "pending"; sync.textContent = queue.length + " not yet saved to the sheet"; }
  else                  { sync.className = "saved";   sync.textContent = "Sheet is up to date"; }

  const q = fold($("q").value.trim());
  const shown = q ? guests.filter((g) =>
    fold(g.name).includes(q) || fold(g.email).includes(q) || fold(g.phone).includes(q)) : guests;

  if (!shown.length) {
    $("list").innerHTML = '<div class="empty">' + (loaded ? "No one matches that." : "") + "</div>";
    return;
  }
  $("list").innerHTML = shown.map((g) => {
    const row = seatOf(g.id);
    const s = row ? seats.find((x) => x.row === row) : null;
    const meta = [g.email, g.phone].filter(Boolean).join(" · ");
    return '<div class="row' + (row ? " done" : "") + '" data-id="' + esc(g.id) + '">' +
      '<div class="who"><div class="nm">' + esc(g.name) + "</div>" +
      (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") + "</div>" +
      (row
        ? '<div class="seatn">' + esc(s ? s.colour + " " + s.table : "in") + "</div>"
        : '<button class="go" type="button">Check in</button>') +
      "</div>";
  }).join("");
}

/* ----------------------------------------------------------------- export -- */

/* Everything this phone believes, including actions the sheet has never seen.
   Both E and I are rebuilt from the same effective state, so the file is
   internally consistent even if Google never received the last check-in. */
function occupantOf(row) {
  const g = guests.find((x) => seatOf(x.id) === row);
  return g ? g.name : "";
}
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCSV() {
  const rows = [["guest_id", "name", "email", "phone", "check-in", "", "colour", "table", "guest"]];
  /* the two blocks are independent lengths, exactly as in the event tab */
  const n = Math.max(guests.length, seats.length);
  for (let i = 0; i < n; i++) {
    const g = guests[i], s = seats[i];
    const row = g ? seatOf(g.id) : null;
    const seat = row ? seats.find((x) => x.row === row) : null;
    rows.push([
      g ? g.id : "", g ? g.name : "", g ? g.email : "", g ? g.phone : "",
      seat ? seat.colour + " " + seat.table : "",
      "",
      s ? s.colour : "", s ? s.table : "", s ? occupantOf(s.row) : ""
    ]);
  }
  return rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
}
async function exportCSV() {
  const name = (TAB || "checkin") + "-backup.csv";
  const text = buildCSV();
  const file = new File([text], name, { type: "text/csv" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$("save").onclick = exportCSV;

/* one listener for the whole list, so re-rendering never leaves handlers behind */
$("list").addEventListener("click", (e) => {
  const btn = e.target.closest(".go");
  if (!btn) return;
  const id = btn.closest(".row").dataset.id;
  const g = guests.find((x) => x.id === id);
  if (g) checkIn(g);
});
$("list").addEventListener("pointerdown", (e) => {
  const btn = e.target.closest(".go");
  if (btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 140); }
});
$("q").addEventListener("input", render);
$("undo").onclick = undo;

/* ------------------------------------------------------------------- boot -- */

(async function start() {
  if (!TAB) { setBanner("No event given. Add ?tab=your-tab-name to the URL."); return; }

  /* The cache is loaded into memory first — that is where any unsent actions
     live — but nothing is painted from it yet. Google is authoritative whenever
     it can be reached; the deadline is what stops a hung request from leaving
     the door looking at an empty screen. */
  const cached = load();
  try {
    await pull();
    setBanner("");
  } catch (e) {
    loaded = cached;
    setBanner(cached ? "Working from the last saved copy — " + e.message
                     : "Cannot reach the sheet: " + e.message, "net");
  }
  render();
  flush();

  /* Not polling: this only reaches the network while something is queued, and
     that is the retry the offline model depends on. */
  setInterval(() => { if (queue.length) flush(); }, 8000);
  window.addEventListener("online", sync);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
